name: Deploy Frontend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "📦 Force-sync latest frontend code (develop)"
            cd /opt/recruitpro/recuit-pro-fe/recruit-pro-fe
            git fetch origin
            git reset --hard origin/develop
            git clean -fd

            echo "🏗️  Build"
            npm ci
            npm run build

            # Fail loudly if the build produced nothing (prevents shipping a stale/empty site).
            test -f dist/index.html

            echo "🚚 Publish"
            rm -rf /var/www/html/*
            cp -r dist/* /var/www/html/

            echo "🔁 Restart nginx"
            systemctl restart nginx

            echo "✅ Deployed commit: $(git rev-parse --short HEAD)"
